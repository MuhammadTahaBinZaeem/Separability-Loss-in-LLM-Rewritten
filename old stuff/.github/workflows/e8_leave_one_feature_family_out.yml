name: E8 Leave-One-Feature-Family-Out Fresh Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/e8_leave_one_feature_family_out.yml'
      - 'scripts/25_run_leave_one_feature_family_out.py'
      - 'scripts/check_e8_leave_one_feature_family_out.py'
      - 'docs/leave_one_feature_family_out_protocol.md'

permissions:
  contents: write

concurrency:
  group: e8-leave-one-feature-family-out-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e8-leave-one-feature-family-out:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show run context
        run: |
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_number=${GITHUB_RUN_NUMBER}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"

      - name: Remove old E8 generated outputs before regeneration
        run: |
          rm -f data/results/leave_one_feature_family_out_predictions.csv
          rm -f metadata/leave_one_feature_family_out_summary.csv
          rm -f metadata/leave_one_feature_family_out_delta_vs_full.csv
          rm -f metadata/leave_one_feature_family_out_feature_registry.csv
          rm -f metadata/leave_one_feature_family_out_manifest.csv
          rm -f logs/leave_one_feature_family_out_report.md
          rm -f logs/e8_leave_one_feature_family_out_workflow_proof.md

      - name: Run E8 leave-one-feature-family-out ablation
        run: python scripts/25_run_leave_one_feature_family_out.py

      - name: Check E8 outputs
        run: python scripts/check_e8_leave_one_feature_family_out.py

      - name: Write workflow proof log
        run: |
          mkdir -p logs
          cat > logs/e8_leave_one_feature_family_out_workflow_proof.md <<EOF
          # E8 Leave-One-Feature-Family-Out Workflow Proof

          This file is generated by GitHub Actions after rerunning E8 from repository inputs.

          - workflow: ${GITHUB_WORKFLOW}
          - run_id: ${GITHUB_RUN_ID}
          - run_number: ${GITHUB_RUN_NUMBER}
          - actor: ${GITHUB_ACTOR}
          - trigger: ${GITHUB_EVENT_NAME}
          - ref: ${GITHUB_REF}
          - source_sha: ${GITHUB_SHA}
          - generated_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          The workflow removed prior E8 generated outputs, regenerated them using:

          ```bash
          python scripts/25_run_leave_one_feature_family_out.py
          python scripts/check_e8_leave_one_feature_family_out.py
          ```

          The checker passed before this file was committed.
          EOF

      - name: Commit regenerated E8 outputs and proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/leave_one_feature_family_out_predictions.csv \
                  metadata/leave_one_feature_family_out_summary.csv \
                  metadata/leave_one_feature_family_out_delta_vs_full.csv \
                  metadata/leave_one_feature_family_out_feature_registry.csv \
                  metadata/leave_one_feature_family_out_manifest.csv \
                  logs/leave_one_feature_family_out_report.md \
                  logs/e8_leave_one_feature_family_out_workflow_proof.md
          if git diff --cached --quiet; then
            echo "No E8 output changes to commit."
          else
            git commit -m "Generate E8 leave-one-feature-family-out outputs via workflow"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
