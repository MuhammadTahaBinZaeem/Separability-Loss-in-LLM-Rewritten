name: E7 Length-Band Robustness Fresh Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/e7_length_band_robustness.yml'
      - 'scripts/24_run_length_band_robustness.py'
      - 'scripts/check_e7_length_band_robustness.py'
      - 'docs/length_band_robustness_protocol.md'

permissions:
  contents: write

concurrency:
  group: e7-length-band-robustness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e7-length-band-robustness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show run context
        run: |
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_number=${GITHUB_RUN_NUMBER}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"

      - name: Remove old E7 generated outputs before regeneration
        run: |
          rm -f data/results/length_band_transfer_predictions.csv
          rm -f metadata/length_band_transfer_summary.csv
          rm -f metadata/length_band_distribution_summary.csv
          rm -f metadata/length_band_manifest.csv
          rm -f logs/length_band_robustness_report.md
          rm -f logs/e7_length_band_robustness_workflow_proof.md

      - name: Run E7 length-band robustness analysis
        run: python scripts/24_run_length_band_robustness.py

      - name: Check E7 outputs
        run: python scripts/check_e7_length_band_robustness.py

      - name: Write workflow proof log
        run: |
          mkdir -p logs
          cat > logs/e7_length_band_robustness_workflow_proof.md <<EOF
          # E7 Length-Band Robustness Workflow Proof

          This file is generated by GitHub Actions after rerunning E7 from repository inputs.

          - workflow: ${GITHUB_WORKFLOW}
          - run_id: ${GITHUB_RUN_ID}
          - run_number: ${GITHUB_RUN_NUMBER}
          - actor: ${GITHUB_ACTOR}
          - trigger: ${GITHUB_EVENT_NAME}
          - ref: ${GITHUB_REF}
          - source_sha: ${GITHUB_SHA}
          - generated_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          The workflow removed prior E7 generated outputs, regenerated them using:

          ```bash
          python scripts/24_run_length_band_robustness.py
          python scripts/check_e7_length_band_robustness.py
          ```

          The checker passed before this file was committed.
          EOF

      - name: Commit regenerated E7 outputs and proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/length_band_transfer_predictions.csv \
                  metadata/length_band_transfer_summary.csv \
                  metadata/length_band_distribution_summary.csv \
                  metadata/length_band_manifest.csv \
                  logs/length_band_robustness_report.md \
                  logs/e7_length_band_robustness_workflow_proof.md
          if git diff --cached --quiet; then
            echo "No E7 output changes to commit."
          else
            git commit -m "Generate E7 length-band robustness outputs via workflow"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
