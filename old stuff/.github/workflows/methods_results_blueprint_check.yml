name: Methods Results Blueprint Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'docs/methods_results_writing_blueprint.md'
      - 'metadata/methods_results_blueprint_checklist.csv'
      - 'scripts/50_check_methods_results_blueprint.py'

permissions:
  contents: write

concurrency:
  group: methods-results-blueprint-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  methods-results-blueprint-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Methods/Results blueprint checker
        run: python scripts/50_check_methods_results_blueprint.py

      - name: Commit Methods/Results blueprint check outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/methods_results_blueprint_check_summary.csv \
                  logs/methods_results_blueprint_check_report.md
          if git diff --cached --quiet; then
            echo "No Methods/Results blueprint-check changes to commit."
          else
            git commit -m "Validate Methods and Results writing blueprint"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
