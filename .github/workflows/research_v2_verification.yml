name: V2 offline research verification

on:
  workflow_dispatch:
  push:
    paths: ['research_v2/**', 'tests/**', 'revision/**', 'requirements-v2.lock', '.github/workflows/research_v2_verification.yml']
  pull_request:
    paths: ['research_v2/**', 'tests/**', 'revision/**', 'requirements-v2.lock', '.github/workflows/research_v2_verification.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: requirements-v2.lock
      - name: Install exact hash-verified dependencies
        run: python -m pip install --require-hashes -r requirements-v2.lock
      - name: Test leakage, provenance and inference guards
        run: python -m pytest -q tests
      - name: Rebuild without credentials or model API calls
        run: python -m research_v2.reproduce
      - name: Preserve diagnostics, including honest incomplete status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-verification-${{ github.run_id }}
          path: |
            revision/verification/
            revision/readiness.json
            revision/results/analysis_status.json
            revision/paper_assets/
          retention-days: 90
