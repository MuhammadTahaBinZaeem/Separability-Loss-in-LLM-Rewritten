name: E3 Warning-Row Sensitivity Fresh Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/e3_warning_row_sensitivity.yml'
      - 'scripts/22_run_warning_row_sensitivity.py'
      - 'scripts/check_e3_warning_row_sensitivity.py'
      - 'docs/warning_row_sensitivity_protocol.md'

permissions:
  contents: write

concurrency:
  group: e3-warning-row-sensitivity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e3-warning-row-sensitivity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show run context
        run: |
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_number=${GITHUB_RUN_NUMBER}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"

      - name: Remove old E3 generated outputs before regeneration
        run: |
          rm -f data/results/warning_row_sensitivity_transfer_predictions.csv
          rm -f metadata/warning_row_sensitivity_transfer_summary.csv
          rm -f metadata/warning_row_sensitivity_same_condition_summary.csv
          rm -f metadata/warning_row_sensitivity_distance_summary.csv
          rm -f metadata/warning_row_sensitivity_feature_family_summary.csv
          rm -f metadata/warning_row_sensitivity_bootstrap_macro_f1_loss.csv
          rm -f metadata/warning_row_sensitivity_subset_counts.csv
          rm -f metadata/warning_row_sensitivity_manifest.csv
          rm -f logs/warning_row_sensitivity_report.md
          rm -f logs/e3_warning_row_sensitivity_workflow_proof.md

      - name: Run E3 warning-row sensitivity analysis
        run: python scripts/22_run_warning_row_sensitivity.py

      - name: Check E3 outputs
        run: python scripts/check_e3_warning_row_sensitivity.py

      - name: Write workflow proof log
        run: |
          mkdir -p logs
          cat > logs/e3_warning_row_sensitivity_workflow_proof.md <<EOF
          # E3 Warning-Row Sensitivity Workflow Proof

          This file is generated by GitHub Actions after rerunning E3 from repository inputs.

          - workflow: ${GITHUB_WORKFLOW}
          - run_id: ${GITHUB_RUN_ID}
          - run_number: ${GITHUB_RUN_NUMBER}
          - actor: ${GITHUB_ACTOR}
          - trigger: ${GITHUB_EVENT_NAME}
          - ref: ${GITHUB_REF}
          - source_sha: ${GITHUB_SHA}
          - generated_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          The workflow removed prior E3 generated outputs, regenerated them using:

          ```bash
          python scripts/22_run_warning_row_sensitivity.py
          python scripts/check_e3_warning_row_sensitivity.py
          ```

          The checker passed before this file was committed.
          EOF

      - name: Commit regenerated E3 outputs and proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/warning_row_sensitivity_transfer_predictions.csv \
                  metadata/warning_row_sensitivity_transfer_summary.csv \
                  metadata/warning_row_sensitivity_same_condition_summary.csv \
                  metadata/warning_row_sensitivity_distance_summary.csv \
                  metadata/warning_row_sensitivity_feature_family_summary.csv \
                  metadata/warning_row_sensitivity_bootstrap_macro_f1_loss.csv \
                  metadata/warning_row_sensitivity_subset_counts.csv \
                  metadata/warning_row_sensitivity_manifest.csv \
                  logs/warning_row_sensitivity_report.md \
                  logs/e3_warning_row_sensitivity_workflow_proof.md
          if git diff --cached --quiet; then
            echo "No E3 output changes to commit."
          else
            git commit -m "Regenerate E3 warning-row sensitivity outputs via workflow"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
