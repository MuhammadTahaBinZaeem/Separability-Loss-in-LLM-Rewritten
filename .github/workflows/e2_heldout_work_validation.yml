name: E2 Held-Out-Work Validation Fresh Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/e2_heldout_work_validation.yml'
      - 'scripts/23_run_heldout_work_validation.py'
      - 'scripts/check_e2_heldout_work_validation.py'
      - 'docs/heldout_work_validation_protocol.md'

permissions:
  contents: write

concurrency:
  group: e2-heldout-work-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2-heldout-work-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show run context
        run: |
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_number=${GITHUB_RUN_NUMBER}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"

      - name: Remove old E2 generated outputs before regeneration
        run: |
          rm -f metadata/heldout_work_fold_registry.csv
          rm -f data/results/heldout_work_transfer_predictions.csv
          rm -f metadata/heldout_work_transfer_summary.csv
          rm -f metadata/heldout_work_same_condition_summary.csv
          rm -f metadata/heldout_work_distance_summary.csv
          rm -f metadata/heldout_work_manifest.csv
          rm -f logs/heldout_work_validation_report.md
          rm -f logs/e2_heldout_work_validation_workflow_proof.md

      - name: Run E2 held-out-work validation
        run: python scripts/23_run_heldout_work_validation.py

      - name: Check E2 outputs
        run: python scripts/check_e2_heldout_work_validation.py

      - name: Write workflow proof log
        run: |
          mkdir -p logs
          cat > logs/e2_heldout_work_validation_workflow_proof.md <<EOF
          # E2 Held-Out-Work Validation Workflow Proof

          This file is generated by GitHub Actions after rerunning E2 from repository inputs.

          - workflow: ${GITHUB_WORKFLOW}
          - run_id: ${GITHUB_RUN_ID}
          - run_number: ${GITHUB_RUN_NUMBER}
          - actor: ${GITHUB_ACTOR}
          - trigger: ${GITHUB_EVENT_NAME}
          - ref: ${GITHUB_REF}
          - source_sha: ${GITHUB_SHA}
          - generated_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          The workflow removed prior E2 generated outputs, regenerated them using:

          ```bash
          python scripts/23_run_heldout_work_validation.py
          python scripts/check_e2_heldout_work_validation.py
          ```

          The checker passed before this file was committed.
          EOF

      - name: Commit regenerated E2 outputs and proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/heldout_work_fold_registry.csv \
                  data/results/heldout_work_transfer_predictions.csv \
                  metadata/heldout_work_transfer_summary.csv \
                  metadata/heldout_work_same_condition_summary.csv \
                  metadata/heldout_work_distance_summary.csv \
                  metadata/heldout_work_manifest.csv \
                  logs/heldout_work_validation_report.md \
                  logs/e2_heldout_work_validation_workflow_proof.md
          if git diff --cached --quiet; then
            echo "No E2 output changes to commit."
          else
            git commit -m "Generate E2 held-out-work validation outputs via workflow"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
