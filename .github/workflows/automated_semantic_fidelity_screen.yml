name: Automated Semantic Fidelity Screen

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/41_run_automated_semantic_fidelity_screen.py'
      - 'data/audit/semantic_fidelity_sample.csv'

permissions:
  contents: write

concurrency:
  group: automated-semantic-fidelity-screen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-semantic-fidelity-screen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run automated semantic fidelity screen
        run: python scripts/41_run_automated_semantic_fidelity_screen.py

      - name: Commit automated semantic fidelity screen outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audit/automated_semantic_fidelity_screen.csv \
                  metadata/automated_semantic_fidelity_screen_summary.csv \
                  metadata/automated_semantic_fidelity_screen_manifest.csv \
                  logs/automated_semantic_fidelity_screen_report.md
          if git diff --cached --quiet; then
            echo "No automated semantic-fidelity screen changes to commit."
          else
            git commit -m "Run automated semantic fidelity screen"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
