name: Manuscript Skeleton Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'paper/manuscript_dsh_skeleton.md'
      - 'scripts/51_check_manuscript_skeleton.py'

permissions:
  contents: write

concurrency:
  group: manuscript-skeleton-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manuscript-skeleton-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run manuscript skeleton checker
        run: python scripts/51_check_manuscript_skeleton.py

      - name: Commit manuscript skeleton check outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/manuscript_skeleton_check_summary.csv \
                  logs/manuscript_skeleton_check_report.md
          if git diff --cached --quiet; then
            echo "No manuscript skeleton-check changes to commit."
          else
            git commit -m "Validate DSH manuscript skeleton"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
