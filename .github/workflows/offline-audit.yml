name: Offline research audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: requirements-v2.lock
      - name: Install hash-locked research dependencies
        run: python -m pip install --require-hashes -r requirements-v2.lock
      - name: Run scientific unit tests
        # The historical manuscript-builder test requires a local-only template.
        run: python -m pytest -q tests -k 'not test_pending_manuscript_has_no_invented_results'
      - name: Verify frozen files, corpus, first outcomes and primary summaries
        run: python audit_tools/replay.py --mode audit --output audit_runs/ci
