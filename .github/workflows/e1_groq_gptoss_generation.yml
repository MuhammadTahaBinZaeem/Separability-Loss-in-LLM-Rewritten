name: V2 controlled rewrite generation

on:
  workflow_dispatch:
    inputs:
      model_key:
        description: 'Frozen model key from revision/generation_plan.json'
        required: true
        type: choice
        options: [gptoss120, qwen27]
        default: gptoss120
      max_requests:
        description: 'Maximum new responses; 0 runs all remaining frozen requests'
        required: true
        default: '3'
      runtime_minutes:
        description: 'Checkpoint and stop before the job deadline'
        required: true
        default: '290'

permissions:
  contents: read

concurrency:
  group: revised-generation-${{ github.ref }}-${{ inputs.model_key }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
      - name: Run immutable, blinded requests
        env:
          GROQ_GPTOSS_API_KEY: ${{ secrets.GROQ_GPTOSS_API_KEY }}
          GROQ_QWEN_API_KEY: ${{ secrets.GROQ_QWEN_API_KEY }}
          MODEL_KEY: ${{ inputs.model_key }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          RUNTIME_MINUTES: ${{ inputs.runtime_minutes }}
        run: >-
          python -m research_v2.generation run
          --model "$MODEL_KEY"
          --limit "$MAX_REQUESTS"
          --minutes "$RUNTIME_MINUTES"
      - name: Upload raw response checkpoints and recomputed QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-generation-${{ inputs.model_key }}-${{ github.run_id }}
          path: revision/generation/${{ inputs.model_key }}/
          retention-days: 90
          if-no-files-found: error
